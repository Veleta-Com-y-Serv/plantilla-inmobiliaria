      - { titulo: Aldea Moret }

  valoracion:
    activa: true
    antetitulo: ¿Quieres vender?
    titulo: Te decimos cuánto vale tu casa, sin compromiso
    texto: Visitamos tu vivienda, la comparamos con ventas reales de la zona y te damos un precio en 48 horas.
    imagen: /fotos/valoracion.jpg
    cta: { texto: Pedir valoración gratuita, url: "/#contacto" }
    items:
      - { titulo: Precio realista desde el primer día, texto: Sin inflar el precio para luego bajarlo. }
      - { titulo: Fotos cuidadas y anuncio en los portales, texto: Tu casa se ve bien y llega a más gente. }
      - { titulo: Un solo agente de principio a fin, texto: Siempre sabes con quién hablar. }

