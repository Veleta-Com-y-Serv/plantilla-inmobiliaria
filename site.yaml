      - { nombre: Andrés Pizarro, cargo: Venta y valoraciones, foto: /placeholders/persona.svg, texto: Se encarga de valorar y anunciar cada vivienda. }
      - { nombre: Marisa Durán, cargo: Alquileres, foto: /placeholders/persona.svg, texto: "Contratos, inquilinos y gestión del día a día." }
      - { nombre: Jorge Mateos, cargo: Atención al cliente, foto: /placeholders/persona.svg, texto: Organiza las visitas y resuelve tus dudas. }

