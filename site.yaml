      - { titulo: Alquiler, texto: "Seleccionamos inquilinos con garantías y preparamos el contrato.", icono: llave }
      - { titulo: Gestión de alquileres, texto: "Cobros, incidencias y fianzas. Tú cobras cada mes sin preocuparte.", icono: documento }

