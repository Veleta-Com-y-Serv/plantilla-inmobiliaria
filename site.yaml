  direccion: Avenida de España 14, local 2, 10002 Cáceres
  horario: Lunes a viernes de 9:30 a 14:00 y de 17:00 a 20:00. Sábados de 10:00 a 13:30.
  whatsapp: "+34 659 21 46 08"
redes:
  instagram: https://www.instagram.com/
  facebook: https://www.facebook.com/
  linkedin: ""
menu:
