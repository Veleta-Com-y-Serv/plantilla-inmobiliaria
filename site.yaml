  zonas:
    activa: true
    antetitulo: Zonas
    titulo: Conocemos cada barrio
    texto: Trabajamos en Cáceres capital y en los pueblos a menos de veinte minutos.
    imagen: /fotos/zonas.jpg
    titulo_pagina: "Inmobiliaria en {zona}"
    texto_pagina: "{negocio} te ayuda a comprar, vender o alquilar en {zona}."
    items:
      - titulo: Parte Antigua
        texto: "Casas con historia, patios interiores y pisos rehabilitados dentro del casco histórico. Aquí vendemos y alquilamos viviendas con mucho carácter, muy buscadas tanto por quien quiere vivir en el centro como por quien busca una inversión estable. Conocemos la normativa de la zona, las ayudas a la rehabilitación y el estado real de cada edificio, y te lo explicamos antes de visitar nada. Todo queda a pie: la Plaza Mayor, el comercio de siempre y los restaurantes."
      - titulo: Centro · Cánovas
        texto: "Pisos amplios, exteriores y con ascensor junto al paseo de Cánovas, una de las zonas más cómodas de la ciudad para vivir sin coche. Mucho comercio, colegios y servicios a mano. Trabajamos compraventas y alquileres de viviendas familiares, algunas ya reformadas y otras para actualizar a tu gusto. Si tienes un piso aquí y quieres saber cuánto vale, lo valoramos sin coste comparándolo con ventas reales del barrio."
      - titulo: Nuevo Cáceres
        texto: "Zona residencial y tranquila, con colegios, parques y supermercados cerca. Es el barrio que más nos piden las familias que quieren espacio y buenas comunicaciones. Aquí encontrarás áticos con terraza, pisos con garaje y trastero y viviendas de varias alturas, tanto en venta como en alquiler. Te acompañamos en las visitas y en la negociación, y nos encargamos del contrato si alquilas o de la notaría si compras."
      - titulo: Mejostilla
        texto: "Un barrio bien comunicado y cercano al campus, con una demanda de alquiler muy constante. Buscamos pisos amueblados y con calefacción para estudiantes, profesores y familias que necesitan vivir cerca de todo. Si eres propietario, seleccionamos inquilinos con garantías, preparamos el contrato y llevamos la gestión del día a día. Si buscas, te enseñamos solo las viviendas que encajan con lo que pides, sin perder el tiempo en visitas que no valen la pena."
      - titulo: Casar de Cáceres
        texto: "Un pueblo tranquilo y muy bien comunicado con la capital, con colegio, comercios y servicios propios. Es la opción de muchas familias que buscan una casa con jardín, más metros y un precio más contenido que en la ciudad. Aquí tenemos adosados, casas con patio y parcelas. Conocemos a los vecinos, las calles y los precios de cada una, y te contamos con sinceridad qué merece la pena y qué no."
      - titulo: Malpartida de Cáceres
        texto: "Un pueblo con mucha vida cultural, rodeado de paisaje de dehesa y granito, a un paso de Cáceres. Aquí buscan casa quienes quieren calma sin alejarse de la ciudad. Trabajamos casas de pueblo, viviendas con corral y pisos pequeños, tanto en venta como en alquiler. Te ayudamos a comprobar la documentación, el estado de la vivienda y las posibles reformas, para que decidas con toda la información."
      - titulo: Sierra de Fuentes
        texto: "Un entorno de campo, con vistas abiertas a la sierra y parcelas amplias, muy cerca de Cáceres. Es la zona de los chalets con piscina, los porches y las barbacoas, y de las casas pensadas para disfrutar del exterior. Si quieres vender tu chalet, lo valoramos teniendo en cuenta parcela, instalaciones y orientación. Si buscas, te enseñamos las opciones disponibles y te explicamos los gastos que conlleva mantener una casa así."
      - titulo: Aldea Moret
        texto: "Un barrio tranquilo en las afueras de Cáceres, con aire de pueblo y todos los servicios cerca. Aquí encontrarás viviendas unifamiliares y pisos a precios accesibles, buenos para quienes empiezan o para quienes prefieren una vida más sosegada. Te asesoramos en cada paso: la elección de la vivienda, la negociación con el propietario, la hipoteca y la firma. Y si vendes, te decimos con claridad en qué precio tiene sentido anunciarla."

