  servicios:
    activa: true
    antetitulo: Servicios
    titulo: Te acompañamos de la primera visita a la firma
    texto: Nos ocupamos del papeleo, las visitas y la negociación. Tú solo decides.
    items:
      - { titulo: Compra, texto: "Buscamos por ti, filtramos y te acompañamos a cada visita.", icono: lupa }
