      - { texto: Vendimos el piso de mis padres en dos meses. Nos explicaron cada paso y no tuvimos que preocuparnos de nada., autor: "Carmen R. · Vendió en Cánovas" }
      - { texto: Buscábamos casa con patio en la Parte Antigua y nos enseñaron justo lo que pedíamos. Sin visitas inútiles., autor: "Javier y Elena · Compraron en la Parte Antigua" }
      - { texto: "Llevan el alquiler de mi piso desde hace años. Cobro puntual y, si hay una avería, lo arreglan ellos.", autor: "Tomás G. · Propietario" }

